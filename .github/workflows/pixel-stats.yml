name: pixel stats

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia as 03:17 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/pixel-stats.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar commits.svg
        env:
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/gen_commits.py

      - name: Commitar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commits.svg
          git diff --staged --quiet || git commit -m "chore: atualiza barra de commits"
          git push
